{% set name = "eztaox" %}
{% set version = "0.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/e/eztaox/eztaox-{{ version }}.tar.gz
  sha256: 973ea223e0ae930c6682b654fff6e923c30714034300567170eb8277c0afdb5d

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=62
    - setuptools-scm >=6.2
    - poetry-core
    - pip
  run:
    - python >={{ python_min }}
    - tinygp >=0.3.0,<0.4.0
    - jax <=0.4.31
    - jaxlib <=0.4.31
    # See https://github.com/google-deepmind/optax/issues/1594.
    - optax >=0.2.5,<0.3.0
    - numpyro >=0.17.0,<0.20.0

test:
  imports:
    - eztaox
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/LSST-AGN-Variability/EzTaoX
  summary: "EzTaoX is a flexible framework for multi-wavelength and multi-survey AGN light-curve modeling using Gaussian Processes (GPs).  Built on top of tinygp"
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ywx649999311
    - camposandro
